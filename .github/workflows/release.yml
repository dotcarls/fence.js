# Trunk-based continuous release (ADR-0013). Every push to main:
#   1. candidate: when its Conventional Commits warrant a release, semantic-release names the
#      version and HEAD is tagged vX.Y.Z-rc.N, N counting the candidates for that version;
#   2. checks: every check, on the tarball stamped with that version (checks.yml);
#   3. release: the candidate promoted with no human step: semantic-release publishes the verified
#      tarball to npm with provenance (npm trusted publishing, which names this file and the `npm`
#      environment), then tags vX.Y.Z on the same commit and creates the GitHub release;
#   4. pages: the checked API reference, deployed after the promotion (or when there is none).
# A failed check leaves only the candidate tag; the next push makes the next candidate. Nothing is
# committed to main by the pipeline. The toolchain is the one mise.toml pins (ADR-0011).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch at a time and none cancelled midway: each candidate is named after the
  # releases before it. A newer push waiting here replaces an older one that has not started; the
  # newer run's checks and release include the older push's commits.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: release candidate
    # A manual run may be started from any branch; only main releases or deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the candidate tag (tags are outside main's ruleset)
    outputs:
      release: ${{ steps.candidate.outputs.release }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      # Full history and tags: the version is computed from the commits since the last release.
      # The credential is kept for this job's one push, of the candidate tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: node
          cache_key_prefix: mise-node-mise.toml
      - run: npm ci --ignore-scripts
      - id: candidate
        run: node tools/release/release.ts candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}

  checks:
    needs: candidate
    uses: ./.github/workflows/checks.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      version: ${{ needs.candidate.outputs.version }}
      pages-artifact: true
      commits-from: ${{ github.event.before || '' }}
      commits-to: ${{ github.sha }}

  pages:
    # After the promotion, when there is one, so the documentation never shows a version that is
    # not on npm.
    name: deploy Pages
    needs: [checks, release]
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: promote ${{ needs.candidate.outputs.tag }}
    needs: [candidate, checks]
    if: needs.candidate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the release tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Restored from no cache: nothing a previous run wrote can reach the job that holds the
      # publishing credential. npm (bundled with Node 24.21.0: 11.19.0) does the OIDC exchange.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: node
          cache: false
          github_token: ''
      - run: npm ci --ignore-scripts
      - name: Download the tarball the checks verified
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package
      # semantic-release refuses to release when main has moved past this commit; the newer run
      # releases instead. Its verify step refuses a version other than the candidate's.
      - name: Promote the candidate
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FENCE_VERSION: ${{ needs.candidate.outputs.version }}
          FENCE_TARBALL: ${{ runner.temp }}/package/fence.js-${{ needs.candidate.outputs.version }}.tgz
