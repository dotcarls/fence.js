# Every check a change must pass, as one reusable workflow (ADR-0010). Nothing runs after it
# unless all of it succeeds: ci.yml runs it on pull requests, and release.yml runs it on every push
# to main, deploying Pages and promoting the release candidate only after it passes (ADR-0013).
#
# Every job installs the toolchain with mise from mise.toml, every check leg runs
# `npm run check` and the CodeQL job runs `npm run codeql`, the same commands a contributor and
# the pre-push hook run, so CI and local runs execute identical targets on identical toolchains
# (ADR-0009, ADR-0011, ADR-0012). Two Node lines are tested: the current Active LTS pinned in
# mise.toml, and the upcoming LTS through MISE_NODE_VERSION. Jobs that do not run CodeQL install
# Node alone (`install_args: node`); the CodeQL CLI is 2.7 GB installed.
name: Checks

on:
  workflow_call:
    inputs:
      pages-artifact:
        description: Upload the API reference built by the check as the Pages artifact.
        type: boolean
        default: false
      version:
        description: >-
          The version to stamp into package.json before checking and packing: the release
          candidate's, so the tarball verified is the one published. Empty leaves it as committed.
        type: string
        default: ''
      commits-from:
        description: Check the messages of the commits after this one (a push's `before`, a PR's base).
        type: string
        default: ''
      commits-to:
        description: The last commit whose message is checked; empty skips the commits job.
        type: string
        default: ''
      title:
        description: A pull request title, checked as the message a squash merge would write.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Active LTS from mise.toml
            node-override: ''
            primary: true
          - name: upcoming LTS 26.9.0
            node-override: 26.9.0
    env:
      MISE_NODE_VERSION: ${{ matrix.node-override }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: node
          cache_key_prefix: mise-node-${{ matrix.node-override || 'mise.toml' }}
      - run: npm ci --ignore-scripts
      - name: Stamp the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run check
      - name: Upload the API reference for Pages
        if: matrix.primary && inputs.pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pack:
    # The one tarball everything after this point uses: the consume jobs install it and the
    # release publishes it, so what is published is what was verified.
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: node
          cache_key_prefix: mise-node-mise.toml
      - run: npm ci --ignore-scripts
      - name: Stamp the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Pack without lifecycle scripts (dist/ was just built)
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  consume:
    # The packed tarball, installed by name in a separate project and imported as ESM and
    # required as CommonJS, on both tested Node lines.
    name: consume (${{ matrix.name }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Active LTS from mise.toml
            node-override: ''
          - name: upcoming LTS 26.9.0
            node-override: 26.9.0
    env:
      MISE_NODE_VERSION: ${{ matrix.node-override }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: node
          cache_key_prefix: mise-node-${{ matrix.node-override || 'mise.toml' }}
      - name: Put the toolchain's Node on PATH for directories outside the project
        run: dirname "$(mise which node)" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package
      - name: Install the tarball and import it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/package/fence.js-*.tgz
          node --input-type=module -e "
            import { FenceBuilder } from 'fence.js';
            const fence = FenceBuilder.create().register('min', (v, n) => v.length >= n).min(2).build();
            if (!fence.run('ab').passed || fence.run('a').passed) throw new Error('wrong verdict');
            console.log('esm import ok on', process.version);"
          node -e "
            const { FenceBuilder } = require('fence.js');
            if (typeof FenceBuilder.create !== 'function') throw new Error('missing export');
            console.log('require(esm) ok on', process.version);"

  commits:
    # Conventional Commits (FJ-0026): the release is computed from these messages. A push is
    # checked for the commits it adds, so one nonconforming commit fails its own run and no later one.
    name: commit messages
    if: inputs.commits-to != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: node
          cache_key_prefix: mise-node-mise.toml
      - run: npm ci --ignore-scripts
      - name: Check the commit messages
        env:
          FROM: ${{ inputs.commits-from }}
          TO: ${{ inputs.commits-to }}
        run: |
          if [ -n "$FROM" ] && git merge-base --is-ancestor "$FROM" "$TO" 2>/dev/null; then
            npx commitlint --from "$FROM" --to "$TO" --verbose
          else
            # A new branch, a forced push or a manual run: only the last commit has a known range.
            git log -1 --format=%B "$TO" | npx commitlint --verbose
          fi
      - name: Check the pull request title
        if: inputs.title != ''
        env:
          TITLE: ${{ inputs.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose

  codeql:
    # `npm run codeql` with the CLI mise.toml pins (ADR-0012). The SARIF goes to code scanning
    # whether or not it holds findings, and any finding fails the job, so an alert stops deployment
    # and publishing like any other failed check. No mise cache: a 2.7 GB CodeQL install would
    # crowd the Node installs out of the repository's 10 GB Actions cache.
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          cache: false
      - run: npm run codeql -- --sarif "$RUNNER_TEMP/codeql/javascript.sarif"
      - name: Upload the results to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/codeql/javascript.sarif
          category: /language:javascript-typescript
