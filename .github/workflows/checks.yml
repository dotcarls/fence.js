# Every check a change must pass, as one reusable workflow (ADR-0010). Nothing runs after it
# unless all of it succeeds: ci.yml deploys Pages only after it passes on main, and release.yml
# publishes to npm only after it passes on the tagged commit.
#
# Each leg runs `npm run check`, the same single command a contributor runs locally, on the
# pinned Node (.nvmrc) and on the other supported toolchain lines, so CI and local runs execute
# identical targets (ADR-0009).
name: Checks

on:
  workflow_call:
    inputs:
      pages-artifact:
        description: Upload the API reference built by the check as the Pages artifact.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node from .nvmrc
            node-version-file: .nvmrc
            primary: true
          - name: Node 22.23.2
            node-version: 22.23.2
          - name: Node 26.9.0
            node-version: 26.9.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Upload the API reference for Pages
        if: matrix.primary && inputs.pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  consume:
    # The published tarball, installed by name, imported as ESM and required as CommonJS on the
    # oldest Node lines package.json `engines` admits (require(esm) is unflagged from 20.19.0
    # and 22.12.0).
    name: consume (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22.12.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pack (prepack builds dist/ from a clean tree)
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the tarball and import it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/fence.js-*.tgz
          node --input-type=module -e "
            import { FenceBuilder } from 'fence.js';
            const fence = FenceBuilder.create().register('min', (v, n) => v.length >= n).min(2).build();
            if (!fence.run('ab').passed || fence.run('a').passed) throw new Error('wrong verdict');
            console.log('esm import ok on', process.version);"
          node -e "
            const { FenceBuilder } = require('fence.js');
            if (typeof FenceBuilder.create !== 'function') throw new Error('missing export');
            console.log('require(esm) ok on', process.version);"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript
