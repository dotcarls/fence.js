# Every check a change must pass, as one reusable workflow (ADR-0010). Nothing runs after it
# unless all of it succeeds: ci.yml deploys Pages only after it passes on main, and release.yml
# publishes to npm only after it passes on the tagged commit.
#
# Every job installs the toolchain with mise from mise.toml, and every check leg runs
# `npm run check`, the same single command a contributor runs, so CI and local runs execute
# identical targets on identical toolchains (ADR-0009, ADR-0011). Two Node lines are tested:
# the current Active LTS pinned in mise.toml, and the upcoming LTS through MISE_NODE_VERSION.
name: Checks

on:
  workflow_call:
    inputs:
      pages-artifact:
        description: Upload the API reference built by the check as the Pages artifact.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Active LTS from mise.toml
            node-override: ''
            primary: true
          - name: upcoming LTS 26.9.0
            node-override: 26.9.0
    env:
      MISE_NODE_VERSION: ${{ matrix.node-override }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          cache_key_prefix: mise-node-${{ matrix.node-override || 'mise.toml' }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Upload the API reference for Pages
        if: matrix.primary && inputs.pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pack:
    # The one tarball everything after this point uses: the consume jobs install it and the
    # release publishes it, so what is published is what was verified.
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          cache_key_prefix: mise-node-mise.toml
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack without lifecycle scripts (dist/ was just built)
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  consume:
    # The packed tarball, installed by name in a separate project and imported as ESM and
    # required as CommonJS, on both tested Node lines.
    name: consume (${{ matrix.name }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Active LTS from mise.toml
            node-override: ''
          - name: upcoming LTS 26.9.0
            node-override: 26.9.0
    env:
      MISE_NODE_VERSION: ${{ matrix.node-override }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          cache_key_prefix: mise-node-${{ matrix.node-override || 'mise.toml' }}
      - name: Put the toolchain's Node on PATH for directories outside the project
        run: dirname "$(mise which node)" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package
      - name: Install the tarball and import it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/package/fence.js-*.tgz
          node --input-type=module -e "
            import { FenceBuilder } from 'fence.js';
            const fence = FenceBuilder.create().register('min', (v, n) => v.length >= n).min(2).build();
            if (!fence.run('ab').passed || fence.run('a').passed) throw new Error('wrong verdict');
            console.log('esm import ok on', process.version);"
          node -e "
            const { FenceBuilder } = require('fence.js');
            if (typeof FenceBuilder.create !== 'function') throw new Error('missing export');
            console.log('require(esm) ok on', process.version);"

  codeql:
    # Uploads results to code scanning and fails on any finding, so an alert stops deployment
    # and publishing like any other failed check.
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql
      - name: Fail on any finding
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' "$RUNNER_TEMP"/codeql/*.sarif)
          jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' "$RUNNER_TEMP"/codeql/*.sarif
          echo "CodeQL findings: $count"
          test "$count" -eq 0
