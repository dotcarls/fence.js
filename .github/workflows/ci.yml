# Runs every check on pushes to main, on pull requests, weekly (CodeQL, drift in the pinned
# toolchain) and on demand. Pages is deployed only from main, only after every check passed,
# and deploys the exact artifact the checks built (ADR-0010).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so a scheduled or manual run never cancels a pending push run (and its Pages deploy).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      pages-artifact: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  pages:
    name: deploy Pages
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
