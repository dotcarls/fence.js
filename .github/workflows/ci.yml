name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gates
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run typecheck:examples
      - run: npm run examples
      - run: npm run check:package

  consume:
    # The published package supports Node >= 20.19 even though the dev toolchain needs 22+.
    name: Import on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Import the built package as ESM and as CommonJS
        run: |
          node --input-type=module -e "import('./dist/index.js').then((m) => { if (typeof m.FenceBuilder !== 'function') throw new Error('missing export'); console.log('esm ok', process.version); })"
          node -e "const m = require('./dist/index.js'); if (typeof m.FenceBuilder !== 'function') throw new Error('missing export'); console.log('cjs require(esm) ok', process.version)"
