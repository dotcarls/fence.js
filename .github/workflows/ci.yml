# Runs every check on pull requests, weekly (drift outside the pinned toolchain) and on demand.
# A pull request's commit messages and title are checked too: a squash merge writes the title as the
# commit on main (FJ-0026). Pushes to main run release.yml, which deploys and releases (ADR-0013).
name: CI

on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      commits-from: ${{ github.event.pull_request.base.sha || '' }}
      commits-to: ${{ github.event.pull_request.head.sha || '' }}
      title: ${{ github.event.pull_request.title || '' }}
